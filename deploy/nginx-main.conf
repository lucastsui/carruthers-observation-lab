worker_processes 2;
pid /run/carruthers-gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /var/cache/carruthers-gateway/client;
    proxy_temp_path /var/cache/carruthers-gateway/proxy;
    fastcgi_temp_path /var/cache/carruthers-gateway/fastcgi;
    uwsgi_temp_path /var/cache/carruthers-gateway/uwsgi;
    scgi_temp_path /var/cache/carruthers-gateway/scgi;
    include /etc/carruthers/nginx.conf;
}
