worker_processes 2;
pid carruthers/state/gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
http {
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path carruthers/cache/nginx/client;
    proxy_temp_path carruthers/cache/nginx/proxy;
    limit_req_zone $server_name zone=carruthers_global:1m rate=30r/s;
    limit_conn_zone $server_name zone=carruthers_connections:1m;
    server {
        listen 127.0.0.1:8765;
        server_name _;
        server_tokens off;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 10s;
        send_timeout 30s;
        limit_conn carruthers_connections 32;
        limit_req zone=carruthers_global burst=60 nodelay;
        limit_req_status 429;
        location / {
            proxy_pass http://127.0.0.1:8766;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
            proxy_send_timeout 10s;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_max_temp_file_size 0;
        }
    }
}
